<svg xmlns="http://www.w3.org/2000/svg" width="820" height="256" viewBox="0 0 820 256" role="img" aria-labelledby="title desc">
<title id="title">Model comparison on the eval suite</title>
<desc id="desc">Claude Haiku 5.5: 19 of 19 passed, 2.9 s per reply, US$ 0.03 per eval run; Claude Sonnet 5.5: 18 of 18 passed, 4.3 s per reply, US$ 0.56 per eval run; Groq gpt-oss-120b: 12 of 16 passed, 30.5 s per reply, free per eval run; Groq gpt-oss-20b: 9 of 13 passed, 64.1 s per reply, free per eval run</desc>
